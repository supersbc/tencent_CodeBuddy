<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDSQL 日志分析与健康评分</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .top-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar h1 { font-size: 1.4em; font-weight: 700; }
        .top-bar .nav-links { display: flex; gap: 18px; }
        .top-bar .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.95em;
            padding: 6px 14px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .top-bar .nav-links a:hover, .top-bar .nav-links a.active { background: rgba(255,255,255,0.2); color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* 输入区域 */
        .input-section {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .input-section h2 { font-size: 1.3em; margin-bottom: 20px; color: #1a1a2e; }
        .tab-bar {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e8e8e8;
        }
        .tab-bar button {
            padding: 10px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95em;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab-bar button.active {
            color: #0f3460;
            border-bottom-color: #0f3460;
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 文本框 */
        textarea {
            width: 100%;
            height: 200px;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85em;
            resize: vertical;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        textarea:focus { outline:none; border-color: #0f3460; background: #fff; }

        /* 文件上传 */
        .upload-zone {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #0f3460;
            background: #f0f4ff;
        }
        .upload-zone .icon { font-size: 3em; margin-bottom: 12px; }
        .upload-zone p { color: #666; }
        .upload-zone .hint { font-size: 0.85em; color: #999; margin-top: 8px; }
        .file-info {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 12px;
            display: none;
            font-size: 0.9em;
        }

        /* 上传进度条 */
        .upload-progress {
            display: none;
            margin-top: 16px;
        }
        .upload-progress.show { display: block; }
        .progress-bar-track {
            height: 12px;
            background: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f3460, #1890ff);
            border-radius: 6px;
            transition: width 0.3s;
            width: 0;
        }
        .progress-text {
            font-size: 0.85em;
            color: #666;
            text-align: center;
        }

        /* 路径输入 */
        .path-input {
            display: flex;
            gap: 12px;
        }
        .path-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            font-family: 'Consolas', monospace;
        }
        .path-input input:focus { outline: none; border-color: #0f3460; }
        .btn-browse {
            padding: 12px 20px;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-browse:hover { background: #16213e; }

        /* 文件浏览器 */
        .file-browser {
            display: none;
            margin-top: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            max-height: 360px;
            overflow-y: auto;
            background: #fafafa;
        }
        .file-browser.show { display: block; }
        .fb-header {
            padding: 10px 16px;
            background: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
            font-family: 'Consolas', monospace;
            font-size: 0.85em;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .fb-header .fb-up {
            cursor: pointer;
            padding: 2px 8px;
            background: #e0e0e0;
            border-radius: 4px;
            font-size: 0.9em;
            border: none;
            color: #333;
        }
        .fb-header .fb-up:hover { background: #ccc; }
        .fb-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.15s;
        }
        .fb-item:hover { background: #e8f0ff; }
        .fb-item:last-child { border-bottom: none; }
        .fb-icon { margin-right: 10px; font-size: 1.1em; }
        .fb-name { flex: 1; font-family: 'Consolas', monospace; }
        .fb-size { color: #888; font-size: 0.85em; margin-left: 12px; }
        .fb-selected { background: #e6f7ff !important; border-left: 3px solid #1890ff; }
        .fb-file-preview {
            display: none;
            background: #f8f9ff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 0.85em;
        }
        .fb-file-preview.show { display: block; }

        /* 参数设置 */
        .params-row {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .param-group { flex: 1; min-width: 180px; }
        .param-group label {
            display: block;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 4px;
        }
        .param-group input, .param-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
        }

        /* 按钮 */
        .btn-primary {
            padding: 12px 36px;
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(15,52,96,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,52,96,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* 加载动画 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.show { display: flex; }
        .loading-box {
            background: #fff;
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #0f3460;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 结果区域 */
        .results-section { display: none; }
        .results-section.show { display: block; }

        /* 总分卡片 */
        .score-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 20px;
            padding: 40px;
            color: #fff;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(15,52,96,0.3);
            position: relative;
            overflow: hidden;
        }
        .score-hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
        }
        .score-hero .score-number {
            font-size: 5em;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
        }
        .score-hero .score-grade {
            display: inline-block;
            padding: 4px 20px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .grade-A { background: rgba(82,196,26,0.3); color: #95de64; }
        .grade-B { background: rgba(24,144,255,0.3); color: #69c0ff; }
        .grade-C { background: rgba(250,173,20,0.3); color: #ffd666; }
        .grade-D { background: rgba(255,77,79,0.3); color: #ff7875; }
        .grade-F { background: rgba(255,0,0,0.3); color: #ff4d4f; }
        .score-hero .score-label {
            font-size: 1.1em;
            opacity: 0.8;
        }
        .score-hero .summary-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .summary-stat { text-align: center; }
        .summary-stat .value { font-size: 1.8em; font-weight: 700; }
        .summary-stat .label { font-size: 0.85em; opacity: 0.7; }

        /* 维度评分卡片 */
        .dimensions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .dim-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .dim-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .dim-card .dim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .dim-card .dim-label { font-weight: 600; font-size: 1em; }
        .dim-card .dim-grade {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 700;
        }
        .dim-score-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .dim-score-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }
        .dim-card .dim-score-num {
            font-size: 1.6em;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .dim-card .dim-desc {
            font-size: 0.8em;
            color: #888;
        }
        .score-high { color: #52c41a; }
        .score-mid { color: #faad14; }
        .score-low { color: #ff4d4f; }
        .fill-high { background: linear-gradient(90deg, #52c41a, #73d13d); }
        .fill-mid { background: linear-gradient(90deg, #faad14, #ffc53d); }
        .fill-low { background: linear-gradient(90deg, #ff4d4f, #ff7875); }
        .bg-grade-A { background: #f6ffed; color: #52c41a; }
        .bg-grade-B { background: #e6f7ff; color: #1890ff; }
        .bg-grade-C { background: #fffbe6; color: #faad14; }
        .bg-grade-D { background: #fff2e8; color: #fa8c16; }
        .bg-grade-F { background: #fff1f0; color: #ff4d4f; }

        /* 详细面板 */
        .detail-panel {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .detail-panel h3 {
            font-size: 1.15em;
            margin-bottom: 16px;
            color: #1a1a2e;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* 建议卡片 */
        .rec-card {
            border-left: 4px solid #0f3460;
            padding: 16px 20px;
            margin-bottom: 12px;
            background: #fafbfc;
            border-radius: 0 10px 10px 0;
        }
        .rec-card.high { border-left-color: #ff4d4f; background: #fff1f0; }
        .rec-card.medium { border-left-color: #faad14; background: #fffbe6; }
        .rec-card.low { border-left-color: #52c41a; background: #f6ffed; }
        .rec-card .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .rec-card .rec-title { font-weight: 600; font-size: 1em; }
        .rec-card .rec-severity {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .sev-high { background: #ff4d4f; color: #fff; }
        .sev-medium { background: #faad14; color: #fff; }
        .sev-low { background: #52c41a; color: #fff; }
        .rec-card .rec-desc { font-size: 0.9em; color: #555; margin-bottom: 8px; }
        .rec-card .rec-actions {
            list-style: none;
            padding: 0;
        }
        .rec-card .rec-actions li {
            font-size: 0.85em;
            color: #666;
            padding: 3px 0;
            padding-left: 16px;
            position: relative;
        }
        .rec-card .rec-actions li::before {
            content: '>';
            position: absolute;
            left: 0;
            color: #0f3460;
            font-weight: 700;
        }

        /* 模板表格 */
        .tpl-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
        }
        .tpl-table th, .tpl-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        .tpl-table th {
            background: #fafafa;
            font-weight: 600;
            color: #555;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        .tpl-table tr:hover { background: #f8f9ff; }
        .tpl-template {
            font-family: 'Consolas', monospace;
            font-size: 0.85em;
            color: #444;
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 异常窗口列表 */
        .anomaly-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9em;
        }
        .anomaly-item:last-child { border-bottom: none; }
        .anomaly-badge {
            display: inline-block;
            min-width: 50px;
            text-align: center;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85em;
        }
        .anomaly-time { color: #888; font-family: monospace; min-width: 160px; }
        .anomaly-reasons { flex: 1; }
        .anomaly-reasons span {
            display: inline-block;
            padding: 2px 8px;
            background: #fff1f0;
            color: #ff4d4f;
            border-radius: 4px;
            font-size: 0.8em;
            margin: 2px 4px 2px 0;
        }

        /* 图表区域 */
        .chart-container {
            position: relative;
            margin-top: 12px;
        }
        .chart-canvas {
            width: 100%;
            height: 200px;
            background: #fafafa;
            border-radius: 8px;
        }
        .chart-svg { width: 100%; }

        /* 日志级别分布 */
        .level-bars {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .level-bar-item { flex: 1; min-width: 120px; }
        .level-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            margin-bottom: 4px;
        }
        .level-bar-track {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .level-bar-fill { height: 100%; border-radius: 4px; }
        .level-INFO { background: #1890ff; }
        .level-ERROR { background: #ff4d4f; }
        .level-WARN { background: #faad14; }
        .level-DEBUG { background: #52c41a; }
        .level-FATAL { background: #722ed1; }
        .level-TRACE { background: #13c2c2; }

        /* 响应式 */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .input-section, .detail-panel { padding: 20px; }
            .score-hero { padding: 24px; }
            .score-hero .score-number { font-size: 3em; }
            .dimensions-grid { grid-template-columns: 1fr; }
            .params-row { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>TDSQL 日志分析与健康评分</h1>
        <div class="nav-links">
            <a href="/nav">系统导航</a>
            <a href="/predict">部署预测</a>
            <a href="/model_library">模型库</a>
            <a href="/log_analysis" class="active">日志分析</a>
            <a href="/experiment">实验分析</a>
        </div>
    </div>

    <div class="container">
        <!-- 输入区域 -->
        <div class="input-section">
            <h2>日志输入</h2>
            <div class="tab-bar">
                <button class="active" onclick="switchTab('paste')">粘贴日志</button>
                <button onclick="switchTab('upload')">上传文件</button>
                <button onclick="switchTab('path')">服务器路径</button>
            </div>

            <!-- Tab 1: 粘贴日志 -->
            <div id="tab-paste" class="tab-content active">
                <textarea id="logContent" placeholder="在此粘贴 TDSQL 日志内容...&#10;&#10;支持的格式:&#10;[2025-08-04 00:00:01 12345] INFO topic=... timecost=0.001 resultcode=0&#10;2025-08-04 00:00:01,123 [thread] ERROR class - message&#10;..."></textarea>
            </div>

            <!-- Tab 2: 上传文件 -->
            <div id="tab-upload" class="tab-content">
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                    <div class="icon">📄</div>
                    <p>点击或拖拽上传日志文件</p>
                    <p class="hint">支持 .log, .txt, .json 格式，最大 2GB（大文件自动分片上传）</p>
                </div>
                <input type="file" id="fileInput" accept=".log,.txt,.json,.gz" style="display:none" onchange="handleFileSelect(event)">
                <div class="upload-progress" id="uploadProgress">
                    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
                    <div class="progress-text" id="progressText">准备上传...</div>
                </div>
                <div class="file-info" id="fileInfo"></div>
            </div>

            <!-- Tab 3: 服务器路径（推荐，无需上传） -->
            <div id="tab-path" class="tab-content">
                <div class="path-input">
                    <input type="text" id="logPath" placeholder="输入日志文件绝对路径，如 /data/workspace/tencent_CodeBuddy/AIdatabase/log_uploads/interf_instance_15232.2025-08-04.0" value="/data/workspace/tencent_CodeBuddy/AIdatabase/log_uploads/">
                    <button class="btn-browse" onclick="openBrowser()">浏览文件</button>
                </div>
                <div class="file-browser" id="fileBrowser">
                    <div class="fb-header">
                        <button class="fb-up" onclick="browseParent()">.. 上级</button>
                        <span id="fbCurrentPath">/data/workspace</span>
                    </div>
                    <div id="fbList"></div>
                </div>
                <div class="fb-file-preview" id="fbFilePreview"></div>
            </div>

            <!-- 参数设置 -->
            <div class="params-row">
                <div class="param-group">
                    <label>时间窗口大小（秒）</label>
                    <input type="number" id="windowSize" value="60" min="10" max="600">
                </div>
                <div class="param-group">
                    <label>窗口滑动步长（秒）</label>
                    <input type="number" id="windowStep" value="30" min="5" max="300">
                </div>
                <div class="param-group" style="display:flex;align-items:flex-end;">
                    <button class="btn-primary" id="analyzeBtn" onclick="startAnalysis()">开始分析</button>
                </div>
            </div>
        </div>

        <!-- 加载动画 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-box">
                <div class="spinner"></div>
                <div style="font-size:1.1em;font-weight:600;color:#333;">正在分析日志...</div>
                <div style="font-size:0.85em;color:#888;margin-top:8px;">基于 E-Log 方法进行多维度健康评估</div>
            </div>
        </div>

        <!-- 结果区域 -->
        <div class="results-section" id="resultsSection">
            <!-- 总分 -->
            <div class="score-hero" id="scoreHero"></div>

            <!-- 维度评分 -->
            <div class="dimensions-grid" id="dimensionsGrid"></div>

            <!-- 两列布局: 建议 + 模板 -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">
                <!-- 改进建议 -->
                <div class="detail-panel" id="recommendationsPanel">
                    <h3>改进建议</h3>
                    <div id="recommendationsList"></div>
                </div>

                <!-- 日志模板分析 -->
                <div class="detail-panel" id="templatePanel">
                    <h3>日志模板分析 (Drain)</h3>
                    <div id="templateContent"></div>
                </div>
            </div>

            <!-- 时间线图表 -->
            <div class="detail-panel" id="timelinePanel">
                <h3>时间线分析</h3>
                <div id="timelineCharts"></div>
            </div>

            <!-- 异常窗口详情 -->
            <div class="detail-panel" id="anomalyPanel">
                <h3>异常时间窗口详情</h3>
                <div id="anomalyList"></div>
            </div>

            <!-- 日志级别分布 -->
            <div class="detail-panel">
                <h3>日志级别分布</h3>
                <div id="levelDistribution"></div>
            </div>
        </div>
    </div>

<script>
let activeTab = 'paste';
let uploadedFilePath = null;
let currentBrowsePath = '/data/workspace/tencent_CodeBuddy/AIdatabase/log_uploads';

function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-bar button').forEach((btn, i) => {
        btn.classList.toggle('active', ['paste','upload','path'][i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
}

// ============ 分片上传 ============
const CHUNK_SIZE = 10 * 1024 * 1024; // 10MB per chunk

const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

function handleFileSelect(e) {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
}

async function handleFile(file) {
    const sizeMB = (file.size / 1024 / 1024).toFixed(1);
    const fileInfo = document.getElementById('fileInfo');
    const progress = document.getElementById('uploadProgress');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    // 小文件（<50MB）直接整体上传
    if (file.size < 50 * 1024 * 1024) {
        fileInfo.style.display = 'block';
        fileInfo.innerHTML = `正在上传 ${file.name} (${sizeMB}MB)...`;
        progress.classList.remove('show');

        const formData = new FormData();
        formData.append('file', file);
        try {
            const resp = await fetch('/api/log_analysis/upload', { method: 'POST', body: formData });
            const data = await resp.json();
            if (data.success) {
                uploadedFilePath = data.filepath;
                fileInfo.innerHTML = `<strong>${data.filename}</strong> (${sizeMB}MB, ${(data.line_count||0).toLocaleString()} 行)<br>` +
                    `<span style="font-family:monospace;font-size:0.85em;color:#666;">${(data.preview||[]).slice(0,3).join('<br>')}</span>`;
            } else {
                fileInfo.innerHTML = `<span style="color:red;">上传失败: ${data.error}</span>`;
            }
        } catch(err) {
            fileInfo.innerHTML = `<span style="color:red;">上传错误: ${err.message}</span>`;
        }
        return;
    }

    // 大文件：分片上传
    const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    const uploadId = Date.now().toString(36);

    progress.classList.add('show');
    fileInfo.style.display = 'block';
    fileInfo.innerHTML = `准备分片上传 ${file.name} (${sizeMB}MB, ${totalChunks}片)...`;

    const startTime = Date.now();

    for (let i = 0; i < totalChunks; i++) {
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunk = file.slice(start, end);

        const formData = new FormData();
        formData.append('chunk', chunk);
        formData.append('filename', file.name);
        formData.append('chunk_index', i);
        formData.append('total_chunks', totalChunks);
        formData.append('upload_id', uploadId);

        try {
            const resp = await fetch('/api/log_analysis/chunk_upload', { method: 'POST', body: formData });
            const data = await resp.json();

            if (!data.success) {
                fileInfo.innerHTML = `<span style="color:red;">上传失败(片段${i}): ${data.error}</span>`;
                progress.classList.remove('show');
                return;
            }

            const pct = ((i + 1) / totalChunks * 100).toFixed(1);
            progressFill.style.width = pct + '%';

            const elapsed = (Date.now() - startTime) / 1000;
            const speed = ((i + 1) * CHUNK_SIZE / 1024 / 1024 / elapsed).toFixed(1);
            const eta = ((totalChunks - i - 1) * elapsed / (i + 1)).toFixed(0);
            progressText.textContent = `${pct}% (${i+1}/${totalChunks}片) | ${speed}MB/s | 剩余 ~${eta}s`;

            if (data.done) {
                uploadedFilePath = data.filepath;
                const finalMB = (data.file_size / 1024 / 1024).toFixed(1);
                fileInfo.innerHTML = `<strong>${data.filename}</strong> (${finalMB}MB) 上传完成!<br>` +
                    `<span style="font-family:monospace;font-size:0.85em;color:#666;">${(data.preview||[]).slice(0,3).join('<br>')}</span>`;
                progressText.textContent = `上传完成! ${finalMB}MB, 耗时 ${elapsed.toFixed(1)}s`;
            }
        } catch(err) {
            fileInfo.innerHTML = `<span style="color:red;">上传错误(片段${i}): ${err.message}</span>`;
            progress.classList.remove('show');
            return;
        }
    }
}

// ============ 文件浏览器 ============
async function openBrowser() {
    const browser = document.getElementById('fileBrowser');
    browser.classList.toggle('show');
    if (browser.classList.contains('show')) {
        const pathInput = document.getElementById('logPath').value.trim();
        if (pathInput) {
            // 如果输入的是目录就打开它，否则打开其父目录
            await browseTo(pathInput);
        } else {
            await browseTo(currentBrowsePath);
        }
    }
}

async function browseTo(path) {
    try {
        const resp = await fetch('/api/log_analysis/browse', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({path})
        });
        const data = await resp.json();

        if (data.error) {
            document.getElementById('fbList').innerHTML = `<div style="padding:16px;color:#ff4d4f;">${data.error}</div>`;
            return;
        }

        if (data.type === 'file') {
            // 用户选中了一个文件
            document.getElementById('logPath').value = data.path;
            uploadedFilePath = null; // 清除上传路径，用服务器路径
            const preview = document.getElementById('fbFilePreview');
            preview.classList.add('show');
            preview.innerHTML = `<strong>${data.name}</strong> (${data.size_mb}MB)<br>` +
                `<span style="font-family:monospace;color:#666;">${(data.preview||[]).join('<br>')}</span>`;
            document.getElementById('fileBrowser').classList.remove('show');
            return;
        }

        // 目录列表
        currentBrowsePath = data.path;
        document.getElementById('fbCurrentPath').textContent = data.path;

        let html = '';
        (data.items || []).forEach(item => {
            if (item.type === 'dir') {
                html += `<div class="fb-item" onclick="browseTo('${item.path.replace(/'/g,"\\'")}')">
                    <span class="fb-icon">📁</span>
                    <span class="fb-name">${item.name}</span>
                </div>`;
            } else {
                const sizeStr = item.size_mb >= 1 ? item.size_mb + 'MB' : Math.round(item.size/1024) + 'KB';
                html += `<div class="fb-item" onclick="selectFile('${item.path.replace(/'/g,"\\'")}')">
                    <span class="fb-icon">📄</span>
                    <span class="fb-name">${item.name}</span>
                    <span class="fb-size">${sizeStr}</span>
                </div>`;
            }
        });

        if (!data.items || data.items.length === 0) {
            html = '<div style="padding:16px;color:#888;text-align:center;">目录为空或无日志文件</div>';
        }

        document.getElementById('fbList').innerHTML = html;
        document.getElementById('fileBrowser').classList.add('show');
    } catch(err) {
        document.getElementById('fbList').innerHTML = `<div style="padding:16px;color:#ff4d4f;">浏览失败: ${err.message}</div>`;
    }
}

function browseParent() {
    const parent = currentBrowsePath.replace(/\/[^/]*$/, '') || '/';
    browseTo(parent);
}

function selectFile(path) {
    document.getElementById('logPath').value = path;
    document.getElementById('fileBrowser').classList.remove('show');
    // 获取文件预览
    fetch('/api/log_analysis/browse', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({path})
    }).then(r => r.json()).then(data => {
        if (data.type === 'file') {
            const preview = document.getElementById('fbFilePreview');
            preview.classList.add('show');
            preview.innerHTML = `<strong>${data.name}</strong> (${data.size_mb}MB)<br>` +
                `<span style="font-family:monospace;color:#666;">${(data.preview||[]).join('<br>')}</span>`;
        }
    }).catch(() => {});
}

// ============ 开始分析 ============
async function startAnalysis() {
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    document.getElementById('loadingOverlay').classList.add('show');

    const windowSize = parseInt(document.getElementById('windowSize').value) || 60;
    const windowStep = parseInt(document.getElementById('windowStep').value) || 30;

    let body = {};

    if (activeTab === 'paste') {
        const content = document.getElementById('logContent').value.trim();
        if (!content) { alert('请输入日志内容'); btn.disabled = false; document.getElementById('loadingOverlay').classList.remove('show'); return; }
        body = { log_content: content, window_size: windowSize, window_step: windowStep };
    } else if (activeTab === 'upload') {
        if (!uploadedFilePath) { alert('请先上传日志文件'); btn.disabled = false; document.getElementById('loadingOverlay').classList.remove('show'); return; }
        body = { log_path: uploadedFilePath, window_size: windowSize, window_step: windowStep };
    } else if (activeTab === 'path') {
        const path = document.getElementById('logPath').value.trim();
        if (!path) { alert('请输入日志文件路径'); btn.disabled = false; document.getElementById('loadingOverlay').classList.remove('show'); return; }
        body = { log_path: path, window_size: windowSize, window_step: windowStep };
    }

    try {
        const resp = await fetch('/api/log_analysis/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const result = await resp.json();

        if (result.error) {
            alert('分析失败: ' + result.error);
        } else {
            renderResults(result);
        }
    } catch (err) {
        alert('请求失败: ' + err.message);
    } finally {
        btn.disabled = false;
        document.getElementById('loadingOverlay').classList.remove('show');
    }
}

// 渲染结果
function renderResults(data) {
    document.getElementById('resultsSection').classList.add('show');

    const scores = data.scores || {};
    const summary = data.summary || {};
    const dims = scores.dimensions || {};

    // 1. 总分
    const gradeClass = 'grade-' + (scores.overall_grade || 'F');
    document.getElementById('scoreHero').innerHTML = `
        <div class="score-number">${scores.overall || 0}</div>
        <div class="score-grade ${gradeClass}">${scores.overall_grade || 'F'} 级</div>
        <div class="score-label">数据库运行健康综合评分</div>
        <div class="summary-stats">
            <div class="summary-stat"><div class="value">${(summary.total_logs || 0).toLocaleString()}</div><div class="label">分析日志条数</div></div>
            ${summary.total_file_lines && summary.total_file_lines !== summary.total_logs ? '<div class="summary-stat"><div class="value">' + (summary.total_file_lines || 0).toLocaleString() + '</div><div class="label">文件总行数</div></div>' : ''}
            ${summary.file_size_mb ? '<div class="summary-stat"><div class="value">' + summary.file_size_mb + 'MB</div><div class="label">文件大小</div></div>' : ''}
            <div class="summary-stat"><div class="value">${summary.total_windows || 0}</div><div class="label">分析窗口数</div></div>
            <div class="summary-stat"><div class="value">${summary.anomaly_windows || 0}</div><div class="label">异常窗口数</div></div>
            <div class="summary-stat"><div class="value">${summary.total_templates || 0}</div><div class="label">日志模板数</div></div>
            <div class="summary-stat"><div class="value">${summary.analysis_time || 0}s</div><div class="label">分析耗时</div></div>
            ${summary.sampling_info ? '<div style="width:100%;text-align:center;margin-top:12px;font-size:0.85em;opacity:0.8;"><span style="background:rgba(255,255,255,0.15);padding:4px 16px;border-radius:12px;">⚡ ' + summary.sampling_info.note + '</span></div>' : ''}
        </div>
    `;

    // 2. 维度评分
    const dimOrder = ['performance', 'stability', 'availability', 'throughput', 'log_quality'];
    const dimIcons = { performance: '⚡', stability: '🛡️', availability: '✅', throughput: '📊', log_quality: '📋' };
    let dimHtml = '';
    dimOrder.forEach(key => {
        const d = dims[key];
        if (!d) return;
        const scoreClass = d.score >= 80 ? 'score-high' : d.score >= 60 ? 'score-mid' : 'score-low';
        const fillClass = d.score >= 80 ? 'fill-high' : d.score >= 60 ? 'fill-mid' : 'fill-low';
        const bgClass = 'bg-grade-' + d.grade;
        dimHtml += `
            <div class="dim-card">
                <div class="dim-header">
                    <span class="dim-label">${dimIcons[key] || ''} ${d.label}</span>
                    <span class="dim-grade ${bgClass}">${d.grade}</span>
                </div>
                <div class="dim-score-num ${scoreClass}">${d.score}</div>
                <div class="dim-score-bar"><div class="dim-score-fill ${fillClass}" style="width:${d.score}%"></div></div>
                <div class="dim-desc">${d.description}</div>
            </div>`;
    });
    document.getElementById('dimensionsGrid').innerHTML = dimHtml;

    // 3. 建议
    const recs = data.recommendations || [];
    let recHtml = '';
    recs.forEach(r => {
        const sevClass = r.severity === 'high' ? 'sev-high' : r.severity === 'medium' ? 'sev-medium' : 'sev-low';
        const sevLabel = r.severity === 'high' ? '高' : r.severity === 'medium' ? '中' : '低';
        recHtml += `
            <div class="rec-card ${r.severity}">
                <div class="rec-header">
                    <span class="rec-title">${r.title}</span>
                    <span class="rec-severity ${sevClass}">${sevLabel}</span>
                </div>
                <div class="rec-desc">${r.description}</div>
                <ul class="rec-actions">
                    ${(r.actions || []).map(a => '<li>' + a + '</li>').join('')}
                </ul>
            </div>`;
    });
    document.getElementById('recommendationsList').innerHTML = recHtml || '<p style="color:#888;">暂无改进建议</p>';

    // 4. 模板
    const tpl = data.template_stats || {};
    const topTpls = tpl.top_templates || [];
    let tplHtml = `<p style="margin-bottom:12px;color:#666;font-size:0.9em;">共提取 <strong>${tpl.total_templates || 0}</strong> 个日志模板，Top-5 覆盖率 <strong>${(tpl.top5_coverage || 0).toFixed(1)}%</strong></p>`;
    if (topTpls.length > 0) {
        tplHtml += '<table class="tpl-table"><thead><tr><th>ID</th><th>出现次数</th><th>占比</th><th>模板</th></tr></thead><tbody>';
        topTpls.forEach(t => {
            tplHtml += `<tr><td>${t.id}</td><td>${t.count.toLocaleString()}</td><td>${t.percentage}%</td><td class="tpl-template" title="${escHtml(t.template)}">${escHtml(t.template)}</td></tr>`;
        });
        tplHtml += '</tbody></table>';
    }
    document.getElementById('templateContent').innerHTML = tplHtml;

    // 5. 时间线图表（SVG）
    renderTimeline(data.timeline || {});

    // 6. 异常窗口
    const anomalies = data.anomaly_windows || [];
    let anomHtml = '';
    if (anomalies.length === 0) {
        anomHtml = '<p style="color:#52c41a;font-size:0.95em;">未检测到异常时间窗口</p>';
    } else {
        anomalies.slice(0, 30).forEach(a => {
            const bgColor = a.anomaly_score > 50 ? '#ff4d4f' : a.anomaly_score > 20 ? '#faad14' : '#fa8c16';
            anomHtml += `
                <div class="anomaly-item">
                    <span class="anomaly-badge" style="background:${bgColor};color:#fff;">${a.anomaly_score}</span>
                    <span class="anomaly-time">${a.start_time} ~ ${a.end_time}</span>
                    <span style="color:#888;min-width:60px;">E:${a.error_count} W:${a.warn_count}</span>
                    <span class="anomaly-reasons">${(a.reasons || []).map(r => '<span>' + r + '</span>').join('')}</span>
                </div>`;
        });
        if (anomalies.length > 30) {
            anomHtml += `<p style="text-align:center;color:#888;margin-top:12px;">... 还有 ${anomalies.length - 30} 个异常窗口</p>`;
        }
    }
    document.getElementById('anomalyList').innerHTML = anomHtml;

    // 7. 日志级别分布
    const levelDist = summary.level_distribution || {};
    const totalLogs = summary.total_logs || 1;
    const levelColors = { INFO: '#1890ff', ERROR: '#ff4d4f', WARN: '#faad14', WARNING: '#faad14', DEBUG: '#52c41a', FATAL: '#722ed1', TRACE: '#13c2c2' };
    let levelHtml = '<div class="level-bars">';
    Object.entries(levelDist).sort((a,b) => b[1] - a[1]).forEach(([level, count]) => {
        const pct = (count / totalLogs * 100).toFixed(1);
        const color = levelColors[level] || '#999';
        levelHtml += `
            <div class="level-bar-item">
                <div class="level-bar-label"><span>${level}</span><span>${count.toLocaleString()} (${pct}%)</span></div>
                <div class="level-bar-track"><div class="level-bar-fill" style="width:${pct}%;background:${color};"></div></div>
            </div>`;
    });
    levelHtml += '</div>';
    document.getElementById('levelDistribution').innerHTML = levelHtml;

    // 滚动到结果
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// SVG 时间线图表
function renderTimeline(timeline) {
    const container = document.getElementById('timelineCharts');
    if (!timeline.windows || timeline.windows.length === 0) {
        container.innerHTML = '<p style="color:#888;">无时间线数据</p>';
        return;
    }

    const charts = [
        { data: timeline.anomaly_scores, label: '异常评分', color: '#ff4d4f', fillColor: 'rgba(255,77,79,0.15)' },
        { data: timeline.error_counts, label: '错误数量', color: '#fa8c16', fillColor: 'rgba(250,140,22,0.15)' },
        { data: timeline.avg_timecosts, label: '平均响应时间(s)', color: '#1890ff', fillColor: 'rgba(24,144,255,0.15)' },
        { data: timeline.log_counts, label: '日志数量', color: '#52c41a', fillColor: 'rgba(82,196,26,0.15)' },
    ];

    let html = '';
    charts.forEach(chart => {
        html += renderSVGChart(chart.data, chart.label, chart.color, chart.fillColor, timeline.windows);
    });
    container.innerHTML = html;
}

function renderSVGChart(data, label, strokeColor, fillColor, labels) {
    if (!data || data.length === 0) return '';
    const W = 1200, H = 160, pad = { t: 30, b: 30, l: 60, r: 20 };
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const maxVal = Math.max(...data, 0.01);
    const n = data.length;

    let pathD = '', areaD = '';
    data.forEach((v, i) => {
        const x = pad.l + (i / Math.max(n - 1, 1)) * cw;
        const y = pad.t + ch - (v / maxVal) * ch;
        if (i === 0) { pathD += `M${x},${y}`; areaD += `M${x},${pad.t + ch} L${x},${y}`; }
        else { pathD += ` L${x},${y}`; areaD += ` L${x},${y}`; }
    });
    areaD += ` L${pad.l + cw},${pad.t + ch} Z`;

    // Y轴刻度
    let yLabels = '';
    for (let i = 0; i <= 4; i++) {
        const y = pad.t + (ch / 4) * i;
        const val = maxVal * (1 - i / 4);
        yLabels += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + cw}" y2="${y}" stroke="#f0f0f0" stroke-width="1"/>`;
        yLabels += `<text x="${pad.l - 8}" y="${y + 4}" text-anchor="end" fill="#999" font-size="11">${val < 10 ? val.toFixed(2) : Math.round(val)}</text>`;
    }

    return `
        <div style="margin-bottom:16px;">
            <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
                ${yLabels}
                <path d="${areaD}" fill="${fillColor}"/>
                <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="2"/>
                <text x="${pad.l}" y="18" fill="#333" font-size="13" font-weight="600">${label}</text>
                <text x="${W - pad.r}" y="18" fill="#999" font-size="11" text-anchor="end">${n} 个窗口</text>
            </svg>
        </div>`;
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
